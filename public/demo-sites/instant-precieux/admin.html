    <!-- Thème jour / nuit appliqué avant le premier affichage (évite le flash) -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem("ip-theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#14110f");
      })();
    </script>
