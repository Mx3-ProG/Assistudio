<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questions fréquentes — Garage Du Lac</title>
<meta name="description" content="Délais, tarifs, véhicule de remplacement, expertise, paiement.">
<meta name="theme-color" content="#1E293B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231E293B'/%3E%3Cpath d='M62 30a16 16 0 0 0-21.6 21.6L26 66v12h12l14.4-14.4A16 16 0 0 0 74 42l-10.4 10.4-8.4-8.4L62 30Z' fill='%23DC2626'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="faq" data-base="" data-meta="faq">

<header id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container page-hero__inner">
      <nav class="breadcrumb" aria-label="Fil d'Ariane">
        <a href="index.html" data-i18n="nav.home"></a><span data-alert-icon="chevR"></span>
        <span data-i18n="nav.faq"></span>
      </nav>
      <span class="eyebrow" data-i18n="faq.eyebrow"></span>
      <h1 data-i18n="faq.title"></h1>
      <p class="lead" data-i18n="faq.lead"></p>
    </div>
  </section>

  <section class="section--tight">
    <div class="container">
      <div style="max-width:820px" id="faqList"></div>

      <div class="card mt-6" style="max-width:820px;display:flex;gap:20px;align-items:center;flex-wrap:wrap">
        <div style="flex:1 1 300px">
          <h3 style="margin-bottom:4px" data-i18n="faq.stillQ"></h3>
          <p class="muted" style="margin:0;font-size:.92rem" data-i18n="faq.stillD"></p>
        </div>
        <div class="flex gap-2 wrap">
          <a class="btn btn-primary" href="tel:+41244811734" data-icon-btn="phone"><span>+41 24 481 17 34</span></a>
          <a class="btn btn-ghost" href="contact.html" data-i18n="nav.contact"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- Fonctions à venir -->
  <section class="section section--alt">
    <div class="container">
      <div class="upsell">
        <span class="eyebrow" data-i18n="upsell.eyebrow"></span>
        <h2 data-i18n="upsell.title"></h2>
        <p class="lead" style="max-width:640px" data-i18n="upsell.lead"></p>
        <div class="grid grid-2 mt-5" id="upsellGrid" style="gap:12px"></div>
        <div class="mt-6">
          <a class="btn btn-primary btn-lg" href="contact.html?sujet=modules" data-i18n="upsell.cta"></a>
          <p style="margin:14px 0 0;font-size:.82rem" data-i18n="upsell.ctaSub"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Vous aimerez aussi -->
  <section class="section">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="services.alsoLike"></span>
        <h2 data-i18n="services.alsoLike"></h2>
        <p class="lead" data-i18n="services.alsoLikeLead"></p>
      </div>
      <div class="grid grid-3" id="alsoLikeGrid"></div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="assets/js/translations.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/catalog.js"></script>
<script>
(function () {
  var G = window.GDL, S = window.GDL_Store, C = window.GDL_Catalog;
  var KEYS = ['q1','q2','q3','q4','q5','q6','q7','q8','q9','q10'];

  function render() {
    document.getElementById('faqList').innerHTML = KEYS.map(function (k) {
      return '<div class="acc">' +
        '<button class="acc__btn" type="button"><span>' + C.esc(G.t('faq.' + k + '.q')) + '</span>' + G.icon('plus') + '</button>' +
        '<div class="acc__panel"><div>' + C.esc(G.t('faq.' + k + '.a')) + '</div></div></div>';
    }).join('');

    document.getElementById('upsellGrid').innerHTML =
      ['f1', 'f3', 'f4', 'f5'].map(function (k, i) {
        var ico = ['calendar', 'file', 'activity', 'card'][i];
        return '<div class="feature-soon" style="border-color:rgba(255,255,255,.14)">' +
          '<div class="feature-soon__ico" style="background:rgba(252,165,165,.16);color:#FCA5A5">' + G.icon(ico) + '</div>' +
          '<div><h4 style="color:#fff">' + G.t('upsell.' + k + '.t') + '</h4>' +
          '<p style="color:rgba(255,255,255,.68)">' + G.t('upsell.' + k + '.d') + '</p></div></div>';
      }).join('');

    document.getElementById('alsoLikeGrid').innerHTML = C.cards(S.getProducts().slice(6, 9), 'services.html');

    G.initAccordions();
    C.paintInlineIcons();
    G.initReveal();

    /* FAQPage schema pour le SEO */
    var old = document.getElementById('faqSchema');
    if (old) old.remove();
    var s = document.createElement('script');
    s.type = 'application/ld+json';
    s.id = 'faqSchema';
    s.textContent = JSON.stringify({
      '@context': 'https://schema.org', '@type': 'FAQPage',
      mainEntity: KEYS.map(function (k) {
        return { '@type': 'Question', name: G.t('faq.' + k + '.q'),
                 acceptedAnswer: { '@type': 'Answer', text: G.t('faq.' + k + '.a') } };
      })
    });
    document.head.appendChild(s);
  }

  render();
  document.addEventListener('gdl:lang', render);
})();
</script>
<script src="/demo-sites/demo-guard.js" data-demo-name="Garage Du Lac" data-demo-slug="garage-du-lac" data-demo-admin-href="/demo-sites/garage-du-lac/admin/login.html"></script></body>
</html>
