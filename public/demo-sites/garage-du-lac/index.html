<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage Du Lac — Garage automobile à Saint-Gingolph (Valais)</title>
<meta name="description" content="Atelier de réparation automobile à Saint-Gingolph. Service expert, devis clair, réservation en ligne. 5,0 ★ sur 37 avis.">
<meta name="theme-color" content="#1E293B">
<link rel="canonical" href="https://www.garagedulac.ch/">
<meta property="og:type" content="website">
<meta property="og:title" content="Garage Du Lac — Garage automobile à Saint-Gingolph">
<meta property="og:description" content="Diagnostic honnête, devis clair, délais tenus. 5,0 ★ sur 37 avis Google.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231E293B'/%3E%3Cpath d='M62 30a16 16 0 0 0-21.6 21.6L26 66v12h12l14.4-14.4A16 16 0 0 0 74 42l-10.4 10.4-8.4-8.4L62 30Z' fill='%23DC2626'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/main.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "AutoRepair",
  "name": "Garage Du Lac",
  "image": "https://www.garagedulac.ch/assets/img/garage.jpg",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Rte Cantonale 98",
    "postalCode": "1898",
    "addressLocality": "Saint-Gingolph",
    "addressCountry": "CH"
  },
  "telephone": "+41244811734",
  "url": "https://www.garagedulac.ch/",
  "priceRange": "$$",
  "aggregateRating": { "@type": "AggregateRating", "ratingValue": "5.0", "reviewCount": "37" },
  "openingHoursSpecification": [{
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
    "opens": "07:30", "closes": "18:00"
  }]
}
</script>
</head>
<body data-page="home" data-base="" data-meta="home">

<header id="site-header"></header>

<main>

  <!-- ============================ HERO ============================ -->
  <section class="hero">
    <div class="container hero__inner">
      <div>
        <div class="badge-row">
          <span class="badge badge--stars" data-icon="star"><span data-i18n="hero.badge1"></span></span>
          <span class="badge" data-icon="pin"><span data-i18n="hero.badge2"></span></span>
          <span class="badge" data-icon="check"><span data-i18n="hero.badge3"></span></span>
        </div>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="hero__cta">
          <a class="btn btn-primary btn-lg" href="contact.html">
            <span data-i18n="common.book"></span>
          </a>
          <a class="btn btn-ghost btn-lg" href="tel:+41244811734" data-icon-btn="phone">
            <span>+41 24 481 17 34</span>
          </a>
        </div>
        <div class="hero__stats">
          <div class="stat"><strong>5,0 ★</strong><span data-i18n="hero.stat1s"></span></div>
          <div class="stat"><strong>25+</strong><span data-i18n="hero.stat2s"></span></div>
          <div class="stat"><strong>0 CHF</strong><span data-i18n="hero.stat3s"></span></div>
        </div>
      </div>

      <!-- Carte de demande rapide -->
      <div class="hero__card reveal">
        <h3 data-i18n="hero.cardTitle"></h3>
        <p data-i18n="hero.cardSub"></p>
        <form data-gdl-form id="heroForm">
          <div class="field">
            <label for="h-name" data-i18n="form.name"></label>
            <input class="input" id="h-name" name="name" type="text" required data-i18n-attr="placeholder:form.namePh">
            <div class="field-error" role="alert"></div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="h-phone" data-i18n="form.phone"></label>
              <input class="input" id="h-phone" name="phone" type="tel" required data-i18n-attr="placeholder:form.phonePh">
              <div class="field-error" role="alert"></div>
            </div>
            <div class="field">
              <label for="h-service" data-i18n="form.service"></label>
              <select class="select" id="h-service" name="service" required data-service-select></select>
              <div class="field-error" role="alert"></div>
            </div>
          </div>
          <div class="alert alert-success hidden" data-form-success>
            <span data-alert-icon="checkCir"></span>
            <div><b data-i18n="form.okTitle"></b><br><span data-i18n="form.okBody"></span></div>
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%" data-i18n="form.submit"></button>
          <p class="hint" style="margin-top:12px;font-size:.76rem" data-i18n="form.demoNote"></p>
        </form>
      </div>
    </div>
  </section>

  <!-- ========================= POURQUOI NOUS ====================== -->
  <section class="section section--alt">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="why.eyebrow"></span>
        <h2 data-i18n="why.title"></h2>
      </div>
      <div class="grid grid-4" id="whyGrid"></div>
    </div>
  </section>

  <!-- =========================== SERVICES ========================= -->
  <section class="section">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow" data-i18n="services.eyebrow"></span>
        <h2 data-i18n="services.title"></h2>
        <p class="lead" data-i18n="services.lead"></p>
      </div>
      <div class="grid grid-3" id="servicesGrid"></div>
      <div class="center mt-6">
        <a class="btn btn-dark" href="services.html" data-i18n="common.viewAll"></a>
      </div>
    </div>
  </section>

  <!-- ========================== COMMENT ÇA MARCHE ================= -->
  <section class="section section--alt">
    <div class="container">
      <div class="grid grid-2" style="gap:64px;align-items:start">
        <div>
          <span class="eyebrow" data-i18n="steps.eyebrow"></span>
          <h2 data-i18n="steps.title"></h2>
          <div class="card mt-4" style="background:var(--color-surface)">
            <div class="flex items-center gap-3" style="margin-bottom:10px">
              <span data-alert-icon="calendar" style="color:var(--color-accent)"></span>
              <b data-i18n="about.reopenT"></b>
            </div>
            <p class="muted" style="font-size:.9rem;margin:0" data-i18n="about.reopenD"></p>
          </div>
        </div>
        <div class="steps" id="stepsList"></div>
      </div>
    </div>
  </section>

  <!-- ============================ AVIS ============================ -->
  <section class="section">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="reviews.eyebrow"></span>
        <h2 data-i18n="reviews.title"></h2>
        <p class="lead" data-i18n="reviews.lead"></p>
      </div>
      <div class="grid grid-3" id="reviewsGrid"></div>
      <div id="reviewCta"></div>
      <p class="center muted mt-4" style="font-size:.82rem" data-i18n="reviews.src"></p>
    </div>
  </section>

  <!-- ====================== FONCTIONS À VENIR ===================== -->
  <section class="section section--alt">
    <div class="container">
      <div class="upsell">
        <span class="eyebrow" data-i18n="upsell.eyebrow"></span>
        <h2 data-i18n="upsell.title"></h2>
        <p class="lead" style="max-width:640px" data-i18n="upsell.lead"></p>
        <div class="grid grid-2 mt-5" id="upsellGrid" style="gap:12px"></div>
        <div class="mt-6">
          <a class="btn btn-primary btn-lg" href="contact.html?sujet=modules">
            <span data-i18n="upsell.cta"></span>
          </a>
          <p style="margin:14px 0 0;font-size:.82rem" data-i18n="upsell.ctaSub"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================ BLOG ============================ -->
  <section class="section">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow" data-i18n="blog.eyebrow"></span>
        <h2 data-i18n="blog.title"></h2>
        <p class="lead" data-i18n="blog.lead"></p>
      </div>
      <div class="grid grid-3" id="blogGrid"></div>
      <div class="center mt-6"><a class="btn btn-ghost" href="blog.html" data-i18n="common.viewAll"></a></div>
    </div>
  </section>

  <!-- =========================== CTA FINAL ======================== -->
  <section class="section--tight">
    <div class="container">
      <div class="card" style="text-align:center;padding:56px 32px">
        <h2 style="margin-bottom:12px" data-i18n="contact.title"></h2>
        <p class="lead" style="max-width:560px;margin:0 auto 28px" data-i18n="contact.lead"></p>
        <div class="flex gap-3 wrap" style="justify-content:center">
          <a class="btn btn-primary btn-lg" href="contact.html" data-i18n="common.book"></a>
          <a class="btn btn-ghost btn-lg" href="tel:+41244811734" data-icon-btn="phone"><span data-i18n="common.call"></span></a>
        </div>
      </div>
    </div>
  </section>

</main>

<footer id="site-footer"></footer>

<script src="assets/js/translations.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/catalog.js"></script>
<script>
(function () {
  var G = window.GDL, S = window.GDL_Store;

  function render() {
    /* Pourquoi nous */
    document.getElementById('whyGrid').innerHTML =
      ['w1', 'w2', 'w3', 'w4'].map(function (k, i) {
        var ico = ['shield', 'bolt', 'wrench', 'users'][i];
        return '<article class="card card--hover reveal" data-delay="' + (i * 70) + '">' +
          '<div class="card__icon">' + G.icon(ico) + '</div>' +
          '<h3>' + G.t('why.' + k + '.t') + '</h3>' +
          '<p>' + G.t('why.' + k + '.d') + '</p></article>';
      }).join('');

    /* Prestations (6 premières) */
    document.getElementById('servicesGrid').innerHTML =
      GDL_Catalog.cards(S.getProducts().slice(0, 6), 'services.html');

    /* Étapes */
    document.getElementById('stepsList').innerHTML =
      ['s1', 's2', 's3', 's4'].map(function (k, i) {
        return '<div class="step reveal" data-delay="' + (i * 70) + '"><div class="step__n"></div><div>' +
          '<h4>' + G.t('steps.' + k + '.t') + '</h4><p>' + G.t('steps.' + k + '.d') + '</p></div></div>';
      }).join('');

    /* Avis + appel à l'avis Google */
    document.getElementById('reviewsGrid').innerHTML = GDL_Catalog.reviews();
    document.getElementById('reviewCta').innerHTML = GDL_Catalog.reviewCta();

    /* Fonctions à venir */
    document.getElementById('upsellGrid').innerHTML =
      ['f1', 'f2', 'f3', 'f4', 'f5', 'f6'].map(function (k, i) {
        var ico = ['calendar', 'bell', 'file', 'activity', 'card', 'star'][i];
        return '<div class="feature-soon" style="border-color:rgba(255,255,255,.14)">' +
          '<div class="feature-soon__ico" style="background:rgba(252,165,165,.16);color:#FCA5A5">' + G.icon(ico) + '</div>' +
          '<div><h4 style="color:#fff">' + G.t('upsell.' + k + '.t') + '</h4>' +
          '<p style="color:rgba(255,255,255,.68)">' + G.t('upsell.' + k + '.d') + '</p></div></div>';
      }).join('');

    /* Blog (3 derniers) */
    document.getElementById('blogGrid').innerHTML = GDL_Catalog.posts(['p1', 'p2', 'p3']);

    GDL_Catalog.fillServiceSelects();
    GDL_Catalog.paintInlineIcons();
    G.initReveal();
  }

  render();
  document.addEventListener('gdl:lang', render);
})();
</script>
<script src="/demo-sites/demo-guard.js" data-demo-name="Garage Du Lac" data-demo-slug="garage-du-lac" data-demo-admin-href="/demo-sites/garage-du-lac/admin/login.html"></script></body>
</html>
